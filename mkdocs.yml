site_name: BRAIN
site_url: https://sureshparekh.github.io/braindoc/
site_description: GPU-accelerated stellar population synthesis by direct pixel fitting
site_author: Suresh Parekh
repo_url: https://github.com/sureshparekh/brainv1
repo_name: sureshparekh/brainv1
edit_uri: ""

theme:
  name: material
  logo: img/logo.png
  favicon: img/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Installation: install.md
      - Your first fit: quickstart.md
      - Input data: input.md
  - Using BRAIN:
      - The desktop interface: gui.md
      - Settings reference: settings.md
      - Masks and weights: masks.md
      - Understanding the output: output.md
      - Batch and datacubes: batch.md
  - The science:
      - Method: method.md
      - Nebular modes: modes.md
      - Extinction laws: extinction.md
  - Reference:
      - Performance and JAX: performance.md
      - Python API: api.md
      - Troubleshooting: troubleshooting.md
